<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/style.css">
    <title>Contato</title>
</head>
<body>
    <header>
        <nav class="d-flex justify-content-between align-items-center card-box">
            <div class="logo">
                <a href="#"><img src="./images/logo1.svg" alt=""></a>
            </div>
            <div class="menu d-flex">
                <ul class="menu-list justify-content-between align-items-center">
                    <a class="menu-iten" href="./index.html"><li>Home</li></a>
                    <a class="menu-iten" href="./sobre.html"><li>Sobre</li></a>
                    <a class="menu-iten" href="./projetos.html"><li>Projetos</li></a>
                </ul>
            </div>
            <div class="contato">
                <a href="./contato.html"><button class="btn-contato"><strong>contato</strong></button></a>
            </div>
        </nav>
        <div class="title-header">
            <div>
                <h1 class="display-5">Precisa de uma solução?<br> Estamos aqui para ajudar!</h1>
            </div>
        </div>
    </header>
    <section class="d-flex section-contato">
        <div class="contato-label">
            <h2>Estamos aqui para responder suas perguntas e conectá-lo com o que você precisa!</h2>
        </div>
        <div class="contato-form">
            <form>
                <div class="mb-3">
                  <label for="exampleInputEmail1" class="form-label">Nome</label>
                  <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                  </div>
                  <div class="d-flex justify-content-end mt-5">
                      <button type="submit" class="btn-contato">Enviar</button>
                  </div>
              </form>
        </div>
    </section>
    <footer class="">
        <div>
            <img class="footer-img" src="./images/logo1.svg" alt="">
        </div>
        <div>
            <hr>
            <p>Todos os diretos reservados 2025©</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
